name: Build Top Score Issue 5 PDF

on:
  push:
    paths:
      - '.github/workflows/build-top-score5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF helper
        run: python -m pip install --disable-pip-version-check img2pdf

      - name: Download preservation scan and build PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/topscore5/pages
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 \
            'https://seedbox.retromags.com:19918/Retromags%20Collection%202005-2020/Pack%2019/Top%20Score%20Issue%205%20(November-December%201987).cbz' \
            -o /tmp/topscore5/topscore5.cbz
          python - <<'PY'
          import os, re, zipfile
          import img2pdf

          src = '/tmp/topscore5/topscore5.cbz'
          out = 'assets/Top_Score_Issue_5_Nov-Dec_1987.pdf'
          exts = {'.jpg', '.jpeg', '.png', '.tif', '.tiff'}

          def natural_key(s):
              return [int(x) if x.isdigit() else x.lower() for x in re.split(r'(\d+)', s)]

          with zipfile.ZipFile(src) as z:
              names = [n for n in z.namelist() if os.path.splitext(n)[1].lower() in exts and not n.endswith('/')]
              names.sort(key=natural_key)
              if not names:
                  raise SystemExit('No page images found in preservation archive')
              pages = [z.read(n) for n in names]

          with open(out, 'wb') as f:
              f.write(img2pdf.convert(pages))
          print(f'Built {out} from {len(pages)} scanned pages ({os.path.getsize(out):,} bytes)')
          PY

      - name: Commit PDF asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'atariforever2002'
          git config user.email 'dde.biz@gmail.com'
          git add assets/Top_Score_Issue_5_Nov-Dec_1987.pdf
          if git diff --cached --quiet; then
            echo 'PDF asset already current.'
            exit 0
          fi
          git commit -m 'Restore Top Score Issue 5 PDF asset'
          git push
