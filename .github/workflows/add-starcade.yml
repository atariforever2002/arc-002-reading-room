name: Add STARCADE to Reading Room

on:
  push:
    paths:
      - '.github/workflows/add-starcade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add STARCADE section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'WATCH CLASSIC STARCADE EPISODES' in s:
              print('STARCADE section already present.')
              raise SystemExit(0)

          marker = '<div class="section-title">ARCADE HISTORY &amp; RESEARCH</div>'
          if marker not in s:
              raise SystemExit('Insertion marker not found; refusing to modify index.html')

          block = '''<div class="section-title">WATCH / ARCADE TELEVISION</div>
<div class="grid">
<div class="card card-shell">
  <span class="name">STARCADE!</span>
  <span class="note">The wonderfully arcade-soaked 1982–84 game show: contestants answer videogame questions and compete on real arcade machines for prizes. The original producers’ site preserves the show as well as games, contestants, commercials, hotlines, and other period material.</span>
  <span class="source">Official STARCADE! site • JM Production Co.</span>
  <div class="site-actions">
    <a class="site-home" href="http://www.starcade.tv/starcade/games/shows.html" target="_blank" rel="noopener">WATCH CLASSIC STARCADE EPISODES →</a>
    <div class="article-actions">
      <a class="article-link" href="https://www.starcade.tv/" target="_blank" rel="noopener">VISIT OFFICIAL STARCADE! SITE →</a>
      <a class="article-link" href="https://starcade.tv/games/80scommercials.html" target="_blank" rel="noopener">80s COMMERCIALS →</a>
    </div>
  </div>
</div>
</div>

'''
          p.write_text(s.replace(marker, block + marker, 1), encoding='utf-8')
          print('STARCADE section added.')
          PY

      - name: Commit site update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'atariforever2002'
          git config user.email 'dde.biz@gmail.com'
          git add index.html
          git commit -m 'Add STARCADE video archive to Reading Room'
          git push
