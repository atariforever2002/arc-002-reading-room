name: Starcade ordered playlist update

on:
  push:
    paths:
      - '.github/workflows/starcade-ordered-playlist.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Starcade links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          needle = '<a class="site-home" href="https://www.youtube.com/channel/UCKV-uKC9R7D6EkWKESlAM5A/videos" target="_blank" rel="noopener">WATCH STARCADE EPISODES ON YOUTUBE →</a>'
          replacement = '<a class="site-home" href="https://www.youtube.com/watch?v=Xvve3aZjBao&amp;list=PLZsrmBT11LQAFL4_vQFjmQXczCcOGDZpH&amp;index=2" target="_blank" rel="noopener">START WITH EPISODE 001 →</a>'
          if needle not in s:
              raise SystemExit("Current Starcade YouTube button not found")
          s = s.replace(needle, replacement, 1)
          marker = '<div class="article-actions">\n      <a class="article-link" href="https://www.starcade.tv/"'
          added = '<div class="article-actions">\n      <a class="article-link" href="https://www.youtube.com/playlist?list=PLZsrmBT11LQAFL4_vQFjmQXczCcOGDZpH" target="_blank" rel="noopener">BROWSE EPISODES IN ORDER →</a>\n      <a class="article-link" href="https://www.starcade.tv/"'
          if marker not in s:
              raise SystemExit("Starcade secondary-button marker not found")
          s = s.replace(marker, added, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'atariforever2002'
          git config user.email 'dde.biz@gmail.com'
          git add index.html
          git commit -m 'Add ordered Starcade viewing controls'
          git push
